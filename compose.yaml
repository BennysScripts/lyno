services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lyno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyno_local_dev}
      POSTGRES_DB: lyno
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lyno_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyno -d lyno"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lyno_pgdata:
